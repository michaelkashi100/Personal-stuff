<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<!-- Privacy guard: the browser blocks every network request except this site's own files and OpenStreetMap map-tile images.
     connect-src 'none' means scripts cannot fetch/XHR/WebSocket/beacon anything, so file contents cannot be sent out. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<title>My Timeline</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --mute:#94a3b8; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; }
  #import { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:24px; text-align:center; gap:14px; }
  #import h1 { margin:0; }
  #import p { color:var(--mute); max-width:30em; margin:0; }
  .btn { background:var(--acc); color:#04283a; border:0; border-radius:12px; padding:14px 22px; font-size:1rem; font-weight:600; }
  #app { display:none; height:100%; flex-direction:column; }
  nav { display:flex; background:var(--card); padding-top:env(safe-area-inset-top); }
  nav button { flex:1; background:none; border:0; color:var(--mute); padding:14px 4px; font-size:.95rem; }
  nav button.on { color:var(--acc); border-bottom:2px solid var(--acc); }
  main { flex:1; position:relative; min-height:0; }
  #mapView,#statsView { position:absolute; inset:0; }
  #statsView { overflow:auto; padding:16px; display:none; }
  #map { position:absolute; inset:0 0 150px 0; }
  #controls { position:absolute; left:0; right:0; bottom:0; height:150px; background:var(--card); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  #controls .row { display:flex; gap:8px; align-items:center; }
  #controls input[type=range] { flex:1; }
  .btn2 { background:#334155; color:var(--fg); border:0; border-radius:10px; padding:10px 14px; font-size:.95rem; }
  select,#controls button { background:#334155; color:var(--fg); border:0; border-radius:8px; padding:8px 12px; font-size:.95rem; }
    #summary { color:var(--mute); font-size:.85rem; flex:1; }
  #controls .meta { justify-content:space-between; }
  /* timeline bar: movement vs. time spent still */
  #barwrap { position:relative; height:34px; border-radius:8px; overflow:hidden; background:#0f172a; }
  #bar, #fill { position:absolute; inset:0; }
  .seg { position:absolute; top:7px; bottom:7px; border-radius:4px; opacity:.9; min-width:3px; }
  .seg.still { top:0; bottom:0; border-radius:0; opacity:1; display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:repeating-linear-gradient(135deg, #334155 0 5px, #2a3648 5px 10px); }
  .seg.still span { font-size:.68rem; color:var(--mute); white-space:nowrap; }
  #fill { background:rgba(255,255,255,.12); width:0; pointer-events:none; }
  #playhead { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:#fff; pointer-events:none; }
  #barwrap #scrub { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; }
  /* dark map look (tiles are recoloured in the browser; nothing extra is downloaded) */
  .leaflet-container { background:#0b1220; }
  .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.92) saturate(.65) contrast(.95); }
  .leaflet-control-attribution { background:rgba(15,23,42,.7)!important; color:var(--mute)!important; }
  .leaflet-control-attribution a { color:var(--mute)!important; }
  /* car: faces the direction of travel; ring pulses while parked */
  .live .dot { position:absolute; left:6px; top:6px; width:18px; height:18px; box-sizing:border-box; border-radius:50%; background:#38bdf8; border:3px solid #fff; box-shadow:0 0 14px rgba(56,189,248,.85); }
  .live.drive .dot, .live.badge-on .dot { display:none; }
  .live .badge { display:none; position:absolute; left:-3px; top:-3px; width:36px; height:36px; border-radius:50%; background:#0b1220; border:2px solid #38bdf8; box-shadow:0 0 14px rgba(56,189,248,.7); font-size:19px; line-height:32px; text-align:center; }
  .live.badge-on .badge { display:block; }
  .live .carwrap { display:none; }
  .live.drive .carwrap { display:block; }
  .live .carwrap { position:absolute; left:0; top:-12.5px; width:30px; height:55px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.55)); }
  .live .carwrap svg { display:block; }
  .live .ring { position:absolute; left:-8px; top:-8px; width:46px; height:46px; border-radius:50%; border:2px solid #38bdf8; opacity:0; }
  .live.stay .ring { animation:pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { transform:scale(.5); opacity:.9; } 100% { transform:scale(2.2); opacity:0; } }
  /* floating clock panel */
  #hud { position:absolute; top:12px; left:12px; z-index:1000; padding:8px 14px 9px; border-radius:16px; pointer-events:none;
    background:rgba(15,23,42,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(148,163,184,.18); }
  #hudTime { font-size:1.7rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  #hudSub { font-size:.82rem; color:var(--acc); margin-top:2px; }
  #toast { display:none; position:fixed; left:50%; transform:translateX(-50%); bottom:166px; z-index:3000; max-width:90%; padding:10px 16px; border-radius:12px;
    background:rgba(15,23,42,.95); border:1px solid rgba(148,163,184,.3); color:var(--fg); font-size:.9rem; text-align:center; }
</style>
</head>
<body>
<div id="toast" role="status"></div>
<section id="import">
  <h1>📍 My Timeline</h1>
  <p>Pick your Google Timeline export (<code>Timeline.json</code>, <code>Records.json</code> or a Semantic&nbsp;Location&nbsp;History month). It is read on this device only and never uploaded.</p>
  <button class="btn" id="pick">Choose file</button>
  <input type="file" id="file" accept=".json,application/json" hidden multiple>
  <p id="status"></p>
  <p style="font-size:.75rem;opacity:.6">build 11 (smart analysis)</p>
</section>

<section id="app">
  <nav><button data-v="map" class="on">🗺 Map &amp; Replay</button><button data-v="stats">📊 Stats</button></nav>
  <main>
    <div id="mapView">
      <div id="map"></div>
      <div id="hud"><div id="hudTime">--:--</div><div id="hudSub"></div></div>
      <div id="controls">
        <div class="row">
          <select id="day"></select>
          <button id="play">▶ Play</button>
          <select id="speed"><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </div>
        <div id="barwrap"><div id="bar"></div><div id="fill"></div><div id="playhead"></div><input type="range" id="scrub" min="0" max="100000" value="0" aria-label="Replay position"></div>
        <div class="row meta"><span id="summary"></span></div>
      </div>
    </div>
    <div id="statsView"></div>
  </main>
</section>

<script src="lib/leaflet.js"></script>
<script src="parser.js"></script>
<script src="analyze.js"></script>
<script src="app.js"></script>
</body>
</html>
