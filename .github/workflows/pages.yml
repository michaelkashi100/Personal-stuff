name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          # publish every app file; only development files are left out (so new files are never forgotten)
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./test --exclude=./README.md --exclude=./_site -cf - . | (cd _site && tar -xf -)
          echo "Published files:"; find _site -type f | sort
          test -f _site/analyze.js && test -f _site/icons/icon-192.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
