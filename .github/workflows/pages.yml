name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          # publish every app file; only development files are left out (so new files are never forgotten)
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./test --exclude=./android --exclude=./README.md --exclude=./_site -cf - . | (cd _site && tar -xf -)
          echo "Published files:"; find _site -type f | sort
          test -f _site/analyze.js && test -f _site/clean.js && test -f _site/icons/icon-192.png
          test -s _site/sw.js && grep -q "const CACHE" _site/sw.js   # the offline / auto-update file must never ship empty
          python3 .github/scripts/make_bundle.py _site "$(date +%s)"   # lets the Android app update itself from this site
          test -f _site/bundle.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # A separate job (GitHub's recommended layout): the uploaded site has time to be registered before it is deployed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Let the uploaded site be registered
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
